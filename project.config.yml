# yaml-language-server: $schema=https://raw.githubusercontent.com/khmuhib01/agents-template/main/project.config.schema.json
# Draft generated by "init.mjs --scaffold". Review every line (marked TODO) before running init.
name: Cloth
description: "ATELIER ÉTOILE: luxury fashion e-commerce SPA (Vue 3) with a Laravel 13 API and admin CMS"
url: ""
type: fullstack                         # web | api | mobile | fullstack | cli | library | other
stack: [laravel13, php8.3, vue3, vite, tailwind4, pinia, sanctum, mysql, sqlite]
package_manager: composer   # PHP deps; frontend deps use npm

run_in_docker: false   # no Docker; local dev uses php artisan serve / composer dev
docker:
  dir: ""
  service: ""

test_command: "php artisan test"      # PHPUnit; tests in tests/Feature and tests/Unit

branches:
  working: main
  integration:          # empty if you merge straight to production
  production: main

deploy:
  mode: manual                        # git push, then run update.sh on the VPS over SSH
  scope: "backend + frontend: Laravel app and Vite build served together by nginx + PHP-FPM"
  target: "Ubuntu VPS, /var/www/cloth: ssh root@<SERVER_IP> 'bash /var/www/cloth/deploy/update.sh' (see deploy/DEPLOY.md)"
  needs_approval: true

commit_attribution: false
docs_language: English
docs_files: [README.md, deploy/DEPLOY.md]

layout:
  - "app/: Laravel application code (Http, Models, Services, Support, Console, Providers)"
  - "resources/: Vue 3 frontend (js), css, Blade views"
  - "routes/: web.php, api.php, console.php"
  - "database/: migrations, seeders, factories"
  - "tests/: Feature and Unit tests"
  - "deploy/: server provisioning, update and data import scripts, DEPLOY.md"
  - "config/, bootstrap/, public/, storage/: standard Laravel"

local_only:
  - ".env"
  - ".env.backup"
  - ".env.production"
  - "auth.json"
  - "/cloth (stray SQLite DB copy)"
  - "/capcut-drafts.mcpb (unrelated tool bundle)"

notes:
  - "Frontend is a Vue 3 SPA inside Laravel (resources/js, built by Vite); the Laravel API is in app/Http/Controllers/Api."
  - "Admin CRUD for standard modules is driven by app/Support/ResourceRegistry.php and resources/js/admin-resources.js; extend the registry before writing a new controller."
  - "Local dev uses SQLite (.env.example); production uses MySQL 8, PHP 8.4, Node 22, with a queue worker (systemd cloth-queue) and database queue/cache/session drivers."
  - "Production deploy runs migrate --force: write safe, reversible migrations and never edit old ones."
  - "deploy/upload-data.ps1 overwrites the live database; never run it once real orders exist."
  - "deploy/DEPLOY.md is written in Bengali; keep it in Bengali when editing."
  - "Security hardening is covered by tests/Feature/SecurityHardeningTest.php; keep it passing when touching auth, admin or upload code."
  - "Format PHP with Laravel Pint (vendor/bin/pint)."

skills_mode: focused                  # focused = only skills routed for this type/stack (fewer tokens); all = every skill
forbid: []
agents_mirror: true
codex_mirror: true
